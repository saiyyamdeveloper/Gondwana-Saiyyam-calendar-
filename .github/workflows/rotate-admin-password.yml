name: मासिक पासवर्ड-रोटेशन (गोंडवाना एडमिन)
# हर माह 1 तारीख़ 04:00 UTC (≈09:30 IST) — नए पासवर्ड hash repo में, plaintext केवल Gmail पर।
# लॉकआउट-सुरक्षा: SMTP secrets सेट न हों तो रोटेशन ही नहीं होगा (वरना पासवर्ड खो जाता)।
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: smtp
        name: SMTP secrets जाँच
        env:
          H: ${{ secrets.SMTP_HOST }}
          U: ${{ secrets.SMTP_USER }}
          P: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SMTP secrets (SMTP_HOST/SMTP_USER/SMTP_PASS) सेट नहीं — रोटेशन छोड़ा गया। पैनल से मैन्युअल रोटेशन करें: admin.html → 👥 खाता-प्रबंधन"
          fi
      - if: steps.smtp.outputs.ok == 'true'
        name: पासवर्ड रोटेट करें
        run: python3 tools/rotate_admin_password.py
      - if: steps.smtp.outputs.ok == 'true'
        name: नई hash commit+push
        run: |
          git config user.name "gondwana-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-credentials.json
          git diff --cached --quiet || git commit -m "security: मासिक पासवर्ड-रोटेशन (केवल hash)"
          git push
      - if: steps.smtp.outputs.ok == 'true'
        name: नए पासवर्ड Gmail पर भेजें
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 tools/send_mail.py
      - if: always()
        name: सफ़ाई (plaintext कभी न बचे)
        run: rm -f /tmp/gw_newpw.json
